name: Build plugin

on:
  create:
    tags:
      - v*
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Read info.toml
        id: toml
        uses: cssnr/toml-action@v2
        with:
          file: info.toml

      - name: Add CMM_DEV_BUILD define on info.toml
        uses: cssnr/toml-action@v2
        with:
          file: info.toml
          path: $.script.defines
          value: "CMM_DEV_BUILD"
          append: true

      - name: Build .op
        run: |
          name="${{ fromJSON(steps.toml.outputs.data).script.module }}"
          [ -f "$name.op" ] && rm -f "$name.op"
          zip -r "$name.op" info.toml src

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ fromJSON(steps.toml.outputs.data).script.module }}
          path: ${{ fromJSON(steps.toml.outputs.data).script.module }}.op
          archive: false