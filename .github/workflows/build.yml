name: Build plugin

on:
  create:
    tags:
      - v*
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Get build date
        id: date
        run: echo "date=$(date +'%Y%m%d')" >> $GITHUB_OUTPUT

      - name: Read info.toml
        id: toml
        uses: cssnr/toml-action@v1
        with:
          file: info.toml

      - name: Edit version number on info.toml
        uses: cssnr/toml-action@v1
        with:
          file: info.toml
          path: $.meta.version
          value: ${{ fromJSON(steps.toml.outputs.data).meta.version }}.${{ steps.date.outputs.date }}

      - name: Build .op
        run: |
          name="${{ fromJSON(steps.toml.outputs.data).script.module }}"
          [ -f "$name.op" ] && rm -f "$name.op"
          zip -r "$name.op" info.toml src

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ fromJSON(steps.toml.outputs.data).script.module }}
          path: ${{ fromJSON(steps.toml.outputs.data).script.module }}.op
          archive: false