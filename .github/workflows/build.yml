name: Build plugin

on:
  create:
    tags:
      - v*
  workflow_dispatch:

env:
  OP_NAME: CMM

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build .op
        run: |
          name="${{ env.OP_NAME }}"
          [ -f "$name.op" ] && rm -f "$name.op"
          zip -r "$name.op" info.toml src

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.OP_NAME }}
          path: ${{ env.OP_NAME }}.op
          archive: false