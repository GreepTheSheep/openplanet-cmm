name: Build plugin

on:
  workflow_dispatch:

env:
  OP_NAME: CMM

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build .op with 7-Zip
        shell: pwsh
        run: |
          $zip = "C:\Program Files\7-Zip\7z.exe"
          $name = "${{ env.OP_NAME }}"
          if (Test-Path "$name.op") { Remove-Item "$name.op" }
          & $zip a -mx1 -tzip "$name.op" info.toml src

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.OP_NAME }}.op
          path: ${{ env.OP_NAME }}.op